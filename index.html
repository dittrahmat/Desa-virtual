<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desa Harapan Jaya</title>
<style>
:root{--bg:#efe8d4;--ink:#2a2820;--card:#fffcf2;--line:#d6cba9;--acc:#2f7d4f;--mut:#6a665a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141c17;--ink:#ece8da;--card:#1e2a22;--line:#34463a;--acc:#4f9d6f;--mut:#a5ad9f}}
:root[data-theme="dark"]{--bg:#141c17;--ink:#ece8da;--card:#1e2a22;--line:#34463a;--acc:#4f9d6f;--mut:#a5ad9f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{position:relative;width:min(100vw,66vh);width:min(100vw,calc(100dvh*.66));margin:0 auto;overflow:hidden;background:#336a3a}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font:700 21px/1.2 Georgia,serif;margin:0}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mut)}
#wrap{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#336a3a}
canvas{display:block;width:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--acc);color:#fff;font-weight:600}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
#log{font-size:13px;color:var(--mut);margin:6px 0 0;padding-left:18px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:5;overflow:auto}
#modal.on{display:flex}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}
input,select{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ktp h3{margin:0 0 6px;font-size:12px;letter-spacing:.06em;color:var(--acc)}
.ktp dl{display:grid;grid-template-columns:110px 1fr;gap:2px 8px;margin:0}
.ktp dt{color:var(--mut)}.ktp dd{margin:0;font-weight:600}
#err{color:#c0392b;margin:8px 0 0;font-size:13px}
#hud{position:absolute;top:8px;left:8px;right:8px;padding-right:52px;display:flex;flex-wrap:wrap;gap:6px;z-index:5;pointer-events:none}
#hud .chip{background:#000a;color:#fff;border-color:#fff3}
#hud.open .chip{display:none!important}
#mb{position:absolute;right:0;top:0;pointer-events:auto;font-size:22px;line-height:1;padding:7px 12px;background:#000b}
#drawer{position:absolute;top:0;right:0;bottom:0;width:82%;max-width:330px;background:var(--card);border-left:1px solid var(--line);padding:58px 14px 14px;overflow:auto;transform:translateX(105%);transition:transform .25s;z-index:4;display:flex;flex-direction:column;gap:8px}
#drawer.on{transform:none}
#info{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;font-size:14px}
#wl div{padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
</style></head>
<body><main>
<canvas id="cv"></canvas>
<div id="hud"><span class="chip" id="pop">Warga: 1</span><span class="chip" id="st">Menghubungkan…</span><span class="chip" id="note" style="display:none"></span><button id="mb" aria-label="Menu">☰</button></div>
<div id="drawer"><b>🌳 Desa Harapan Jaya</b><button id="join" style="display:none">👤 Buat KTP &amp; Bergabung</button><b>👥 Warga</b><div id="wl"></div><b>📰 Kabar desa</b><ul id="log"><li>Belum ada kabar.</li></ul></div>
<div class="card" id="info" style="display:none"></div>
<div id="modal"><div class="card" style="width:min(430px,100%)">
<div class="top"><b>Kartu Tanda Penduduk Desa</b><canvas id="pv" width="80" height="100" style="width:80px"></canvas></div>
<label>Nama</label><input id="fn" maxlength="24">
<div class="row"><div><label>Usia</label><input id="fu" type="number" min="1" max="110"></div><div><label>Jenis kelamin</label><select id="fg"><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></div></div>
<label>Hobi</label><input id="fh" maxlength="30">
<label>Pekerjaan</label><input id="fp" maxlength="30" placeholder="mis. petani, guru, dokter, tukang">
<label>Nama rumah (opsional)</label><input id="fr" maxlength="30" placeholder="kosong = otomatis">
<p id="err"></p>
<div class="bar"><button id="ok">Jadi Warga</button><button class="alt" id="no">Batal</button></div>
</div></div>
<script>
const $=i=>document.getElementById(i),W=600,H=900;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
let cv=$('cv'),cx=cv.getContext('2d'),S=1;
const KADES={nama:'Pak Kades Hartono',usia:52,hobi:'Memancing dan berkebun',pekerjaan:'Kepala Desa',gender:'L'};
const DIM={rumah:[64,56],balai:[130,86],masjid:[92,98],gereja:[84,100],pasar:[130,60],sekolah:[112,70],puskesmas:[100,64]};
const LBL={rumah:'Rumah warga',balai:'Balai desa',masjid:'Tempat ibadah (masjid)',gereja:'Tempat ibadah (gereja)',pasar:'Pasar desa',sekolah:'Sekolah dasar',puskesmas:'Puskesmas desa'};
const MS=[{id:'balai',tipe:'balai',nama:'Balai Desa Harapan Jaya',min:1,x:300,y:430,dur:20000},
{id:'masjid',tipe:'masjid',nama:'Masjid Al-Ikhlas',min:2,x:130,y:330,dur:25000},
{id:'gereja',tipe:'gereja',nama:'Gereja Kasih Karunia',min:4,x:470,y:330,dur:25000},
{id:'sekolah',tipe:'sekolah',nama:'SD Negeri 1 Harapan Jaya',min:10,x:140,y:680,dur:20000,gr:1},
{id:'pasar',tipe:'pasar',nama:'Pasar Desa Makmur',min:10,x:460,y:680,dur:20000,gr:1},
{id:'puskesmas',tipe:'puskesmas',nama:'Puskesmas Harapan Jaya',min:10,x:300,y:760,dur:20000,gr:1}];
const SLOTS=[[110,500],[490,500],[110,420],[490,420],[220,250],[380,250],[100,570],[500,570],[300,170],[110,170],[490,170],[200,120],[400,120],[120,790],[480,790],[220,845],[380,845],[300,890],[40,640],[560,640],[40,720],[560,720]];
const D={warga:{},bangunan:{}},sim={},LOG=[],seen={};
let uid='',canWrite=false,live=false,put=null,got=0,ens=0;
const R=(x,y,w,h,c)=>{cx.fillStyle=c;cx.fillRect(x,y,w,h)};
const ell=(x,y,a,b)=>{cx.beginPath();cx.ellipse(x,y,a,b,0,0,7);cx.fill()};
const tri=(a,b,c,d,e,f)=>{cx.beginPath();cx.moveTo(a,b);cx.lineTo(c,d);cx.lineTo(e,f);cx.fill()};
const dot=(x,y,r,c)=>{cx.fillStyle=c;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()};
const dome=(x,y,r,c)=>{cx.fillStyle=c;cx.beginPath();cx.arc(x,y,r,Math.PI,0);cx.fill()};
const prog=b=>Math.max(0,Math.min(1,(Date.now()-b.start)/b.dur));
const busy=()=>Object.values(D.bangunan).some(b=>b.tipe!='rumah'&&prog(b)<1);
// ---------- tampilan warga ----------
function look(w,id){
 if(id=='kades')return{g:'L',skin:'#e2b085',hair:'#2b1d14',hs:0,shirt:'#8a5a2b',pants:'#2b2b2b',cap:'peci',kumis:1};
 const h=hash(id||w.nama),j=(w.pekerjaan||'').toLowerCase(),has=(...k)=>k.some(x=>j.includes(x));
 const o={g:w.gender,skin:['#f3cfa8','#e2b085','#c98f64','#a56f47'][h%4],hair:['#2b1d14','#3d2b1b','#18181c','#6a4527'][(h>>2)&3],hs:(h>>4)%3,
  shirt:['#e4572e','#3a86c8','#e0a82e','#8a5fbf','#2fa38a','#d8647f'][(h>>6)%6],pants:'#37466b'};
 const A=x=>Object.assign(o,x);
 if(has('tani','kebun','ternak'))A({shirt:'#6f9a3d',cap:'caping'});
 else if(has('guru','dosen','ustad','ustaz'))A({shirt:'#f2f2f2',tie:'#b03030',item:'buku'});
 else if(has('dokter','perawat','bidan','apoteker'))A({shirt:'#fff',pants:'#e3eef1',item:'steto',cap:has('perawat','bidan')?'perawat':0});
 else if(has('polisi','satpam'))A({shirt:'#7b5a34',pants:'#4a3a24',cap:'polisi'});
 else if(has('tentara','tni','prajurit'))A({shirt:'#55663a',pants:'#47552f',cap:'baret'});
 else if(has('nelayan','pelaut'))A({shirt:'#2f6fa8',pants:'#5b4a35',cap:'topi'});
 else if(has('tukang','buruh','bangun','montir','kuli','mekanik'))A({shirt:'#f08a24',pants:'#4a4f5c',cap:'helm',item:'palu'});
 else if(has('dagang','jual','warung','toko','kios'))A({shirt:'#f4efe0',apron:'#c0472f'});
 else if(has('koki','chef','masak','roti','kue'))A({shirt:'#fafafa',cap:'koki'});
 else if(has('programmer','developer','software','komputer','coder','web','teknologi'))A({shirt:'#6b4fa8',kacamata:1});
 else if(has('pelajar','siswa','mahasiswa','murid'))A({shirt:'#fff',pants:'#c43d3d',tas:1});
 else if(has('sopir','supir','ojek','driver','kurir'))A({shirt:'#2fa35a',cap:'helm',capc:'#2fa35a'});
 else if(has('seniman','pelukis','musisi','penyanyi'))A({cap:'baret',capc:'#7a3fa0'});
 return o}
function person(o,x,y,t,mv,wk){
 const sw=mv?Math.sin(t*10):0;y-=mv?Math.abs(Math.cos(t*10))*1.5:0;
 cx.fillStyle='#0003';ell(x,y+2,10,3.5);
 R(x-6,y-12,5,12+sw*1.5,o.pants);R(x+1,y-12,5,12-sw*1.5,o.pants);R(x-6,y-1+sw*1.5,5,2,'#222');R(x+1,y-1-sw*1.5,5,2,'#222');
 if(o.tas)R(x+6,y-25,6,11,'#3b6bb0');
 if(o.g=='P'&&o.hs==0)R(x-9,y-34,18,17,o.hair);
 if(o.g=='P'&&o.hs!=1){cx.fillStyle=o.shirt;cx.beginPath();cx.moveTo(x-7,y-26);cx.lineTo(x+7,y-26);cx.lineTo(x+10,y-9);cx.lineTo(x-10,y-9);cx.fill()}
 else R(x-7,y-26,14,15,o.shirt);
 if(o.apron)R(x-5,y-22,10,12,o.apron);
 if(o.tie)R(x-1,y-26,3,9,o.tie);
 const ay=wk?-Math.abs(Math.sin(performance.now()/130))*8:sw*2;
 R(x-10,y-25-sw*2,3,11,o.skin);R(x+7,y-25+ay,3,11,o.skin);
 if(o.item=='palu'){R(x+8,y-31+ay,2,8,'#555');R(x+6,y-32+ay,6,3,'#888')}
 if(o.item=='buku')R(x-14,y-17,7,9,'#7a4a2a');
 if(o.item=='steto'){cx.strokeStyle='#444';cx.beginPath();cx.arc(x,y-26,5,0,Math.PI);cx.stroke()}
 dot(x,y-33,8.5,o.skin);dome(x,y-34,9,o.hair);
 if(o.g=='L'&&o.hs==1)dot(x+2,y-43,4,o.hair);
 if(o.g=='P'&&o.hs==1)dot(x+10,y-31,4,o.hair);
 if(o.g=='P'&&o.hs==2)dot(x,y-43,5,o.hair);
 dot(x-3,y-33,1.3,'#222');dot(x+3,y-33,1.3,'#222');R(x-2,y-29,4,1,'#8a4b3a');
 if(o.kumis)R(x-4,y-30.5,8,1.5,'#222');
 if(o.kacamata){cx.strokeStyle='#222';cx.beginPath();cx.arc(x-3,y-33,3,0,7);cx.moveTo(x+6,y-33);cx.arc(x+3,y-33,3,0,7);cx.stroke()}
 const c=o.cap;
 if(c=='caping'){cx.fillStyle='#d9b865';tri(x-16,y-38,x,y-52,x+16,y-38)}
 else if(c=='peci')R(x-8,y-46,16,6,'#1b1b1b');
 else if(c=='polisi'){R(x-8,y-47,16,6,'#3a3326');R(x-9,y-42,18,2,'#222')}
 else if(c=='baret'){cx.fillStyle=o.capc||'#4b5d2a';ell(x-1,y-43,10,4)}
 else if(c=='helm'){dome(x,y-35,9.5,o.capc||'#f2c230');R(x-11,y-36,22,2,o.capc||'#f2c230')}
 else if(c=='topi'){dome(x,y-36,9,'#2f6fa8');R(x-12,y-37,24,2,'#2f6fa8')}
 else if(c=='koki'){R(x-8,y-50,16,10,'#fff');dot(x,y-51,8,'#fff')}
 else if(c=='perawat'){R(x-7,y-46,14,6,'#fff');R(x-1,y-45,2,4,'#d32f2f')}}
// ---------- bangunan ----------
const BODY={
rumah:(b,x,y,w,h)=>{R(x-w/2,y-34,w,34,['#e8d5a8','#d9e6c3','#cfe1ee','#f0cfc4','#ead7f0'][hash(b.nama)%5]);cx.fillStyle='#b5482f';tri(x-w/2-6,y-34,x,y-h,x+w/2+6,y-34);R(x-6,y-20,12,20,'#6b4a2b');R(x-w/2+6,y-26,11,10,'#8fc5e8');R(x+w/2-17,y-26,11,10,'#8fc5e8')},
balai:(b,x,y,w,h)=>{R(x-w/2,y-46,w,46,'#eadfc4');cx.fillStyle='#9c3b2a';tri(x-w/2-8,y-46,x,y-h+10,x+w/2+8,y-46);for(let i=0;i<4;i++)R(x-w/2+8+i*34,y-44,7,44,'#fff8e8');R(x-10,y-28,20,28,'#5a3d22');R(x+w/2-4,y-h-6,2,40,'#555');R(x+w/2-2,y-h-6,16,5,'#d32f2f');R(x+w/2-2,y-h-1,16,5,'#fff')},
masjid:(b,x,y,w,h)=>{R(x-w/2,y-38,w,38,'#f3efe3');R(x+w/2-2,y-86,11,86,'#e9e3d0');dome(x,y-38,26,'#2f9a6a');dome(x+w/2+3.5,y-86,6,'#2f9a6a');R(x-1,y-70,2,12,'#e0b030');R(x-8,y-24,16,24,'#1f6f4c');R(x-w/2+8,y-28,10,12,'#8fc5e8');R(x+w/2-22,y-28,10,12,'#8fc5e8')},
gereja:(b,x,y,w,h)=>{R(x-w/2,y-34,w,34,'#f5f1e6');R(x-13,y-68,26,68,'#efe9da');cx.fillStyle='#6b4a2b';tri(x-16,y-68,x,y-92,x+16,y-68);R(x-1,y-100,2,12,'#444');R(x-4,y-96,8,2,'#444');R(x-7,y-22,14,22,'#5a3d22');R(x-w/2+6,y-26,9,12,'#8fc5e8');R(x+w/2-15,y-26,9,12,'#8fc5e8')},
pasar:(b,x,y,w,h)=>{R(x-w/2,y-6,w,6,'#a98a5a');for(let i=0;i<3;i++){const s=x-w/2+i*44+3;R(s,y-32,3,28,'#6b4a2b');R(s+35,y-32,3,28,'#6b4a2b');R(s+3,y-14,32,8,'#caa66a');dot(s+10,y-17,3,'#e4572e');dot(s+19,y-17,3,'#e0a82e');dot(s+28,y-17,3,'#6f9a3d');R(s,y-46,38,14,i%2?'#d8453a':'#3a86c8')}},
sekolah:(b,x,y,w,h)=>{R(x-w/2,y-42,w,42,'#f4e3b3');R(x-w/2-4,y-48,w+8,8,'#b5482f');for(let i=0;i<4;i++)if(i!=1&&i!=2)R(x-w/2+8+i*26,y-32,14,12,'#8fc5e8');R(x-8,y-24,16,24,'#5a3d22');R(x-1,y-70,2,24,'#555');R(x+1,y-70,12,6,'#d32f2f');R(x+1,y-64,12,5,'#fff')},
puskesmas:(b,x,y,w,h)=>{R(x-w/2,y-40,w,40,'#f6f6f2');R(x-w/2-4,y-46,w+8,7,'#2f9a6a');R(x-8,y-26,16,26,'#7fb8d8');R(x-3,y-62,6,16,'#d32f2f');R(x-8,y-57,16,6,'#d32f2f');R(x-w/2+8,y-32,12,12,'#8fc5e8');R(x+w/2-20,y-32,12,12,'#8fc5e8')}};
function bld(b){
 const[w,h]=DIM[b.tipe]||DIM.rumah,p=prog(b),x=b.x,y=b.y;
 cx.save();
 if(p<1){cx.strokeStyle='#8a6a3a';cx.setLineDash([4,3]);cx.strokeRect(x-w/2,y-h,w,h);cx.setLineDash([]);cx.beginPath();cx.rect(x-w/2-12,y-h*p-1,w+24,h*p+4);cx.clip()}
 (BODY[b.tipe]||BODY.rumah)(b,x,y,w,h);cx.restore()}
const TREES=[];let sd=42;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
for(let i=0;i<200;i++)TREES.push([15+rnd()*570,60+rnd()*820,13+rnd()*9,rnd()]);
function lab(s,x,y){cx.font='600 10px system-ui,sans-serif';cx.textAlign='center';const w=cx.measureText(s).width+8;cx.fillStyle='#000a';cx.fillRect(x-w/2,y-10,w,14);cx.fillStyle='#fff';cx.fillText(s,x,y)}
function drawPaths(B){
 const N=[{x:300,y:500,start:0}].concat(B.map(b=>({x:b.x,y:b.y+6,start:b.start}))).sort((a,b)=>a.start-b.start),P=[],now=Date.now();
 cx.save();cx.lineCap='round';cx.lineJoin='round';
 for(let i=1;i<N.length;i++){const b=N[i],pr=Math.min(1,(now-b.start-3000)/12000);if(pr<=0)continue;
  N.slice(0,i).map(a=>[Math.hypot(a.x-b.x,a.y-b.y),a]).sort((u,v)=>u[0]-v[0]).slice(0,2).forEach(([l,a],k)=>{
   if(k&&l>150)return;
   const mx=(a.x+b.x)/2+hash(a.x+','+b.y)%30-15,my=(a.y+b.y)/2+hash(b.x+','+a.y)%30-15,pts=[];
   for(let j=0;j<=Math.ceil(16*pr);j++){const t=j/16,u=1-t;pts.push([u*u*a.x+2*u*t*mx+t*t*b.x,u*u*a.y+2*u*t*my+t*t*b.y])}
   pts.forEach((p,j)=>j%2||P.push(p));
   for(const[w,c]of[[11,'#a8925c'],[7,'#d4c28c']]){cx.strokeStyle=c;cx.lineWidth=w;cx.beginPath();pts.forEach((p,j)=>j?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.stroke()}})}
 cx.restore();return P}
function draw(t){
 cx.setTransform(S,0,0,S,0,0);
 const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#437f48');g.addColorStop(1,'#336a3a');cx.fillStyle=g;cx.fillRect(0,0,W,H);
 const B=Object.values(D.bangunan).filter(b=>b.start<=Date.now()),clr=(x,y)=>Math.hypot((x-300)/105,(y-500)/70)<1||PT.some(p=>Math.hypot(p[0]-x,p[1]-y)<20)||B.some(b=>{const[w,h]=DIM[b.tipe]||DIM.rumah;return Math.hypot((x-b.x)/(w/2+34),(y-b.y+h/3)/(h/2+30))<1});
 cx.fillStyle='#9cbc6c';ell(300,500,105,70);for(const b of B){const[w,h]=DIM[b.tipe]||DIM.rumah;ell(b.x,b.y-h/3,w/2+30,h/2+24)}
 cx.fillStyle='#c8b57e';ell(300,500,62,38);const PT=drawPaths(B);
 const L=[];
 for(const[x,y,r,c]of TREES)if(!clr(x,y))L.push([y,()=>{R(x-2,y-8,4,10,'#5d4027');dot(x,y-16,r,['#2d6a34','#357a3c','#25592c'][(c*3)|0]);dot(x-r/3,y-r/2-14,r/2,'#4a9150')}]);
 for(const b of B)L.push([b.y,()=>bld(b)]);
 for(const id in sim){const s=sim[id];L.push([s.y,()=>person(s.o,s.x,s.y,t+hash(id)%97,s.mv,s.work)])}
 L.sort((a,b)=>a[0]-b[0]);L.forEach(a=>a[1]());
 for(const b of B){const p=prog(b);lab((p<1&&b.gr?'🤝 ':'')+b.nama+(p<1?' · '+(p*100|0)+'%':''),b.x,b.y+14)}
 for(const id in sim){const s=sim[id];lab((id==uid?'★ ':'')+s.w.nama,s.x,s.y-58)}}
// ---------- simulasi gerak ----------
function tick(dt){
 for(const id in sim)if(id!='kades'&&!D.warga[id])delete sim[id];
 for(const id of['kades',...Object.keys(D.warga)]){
  const w=id=='kades'?KADES:D.warga[id];let s=sim[id];
  if(!s){const x=300+hash(id)%60-30,y=id=='kades'?500:895;s=sim[id]={x,y,tx:x,ty:y,wait:0,o:look(w,id)}}
  s.w=w;const hb=D.bangunan['rumah-'+id];
  const pub=Object.values(D.bangunan).find(b=>b.tipe!='rumah'&&prog(b)<1&&b.start<=Date.now()),site=hb&&prog(hb)<1?hb:(id=='kades'||(pub&&pub.gr))?pub:null;
  s.work=!!site;
  if(site){const w=(DIM[site.tipe]||DIM.rumah)[0],q=hash(id);s.tx=site.x-w/2+q%7/6*w;s.ty=site.y+6+(q>>3)%3*8}
  const dx=s.tx-s.x,dy=s.ty-s.y,d=Math.hypot(dx,dy);
  if(d>2){const v=Math.min(d,(site?60:32)*dt);s.x+=dx/d*v;s.y+=dy/d*v;s.mv=1}
  else{s.mv=0;if(!site&&(s.wait-=dt)<=0){
   const bs=Object.values(D.bangunan).filter(b=>prog(b)>=1);
   if(bs.length&&Math.random()<.6){const b=bs[Math.random()*bs.length|0];s.tx=b.x+Math.random()*30-15;s.ty=b.y+14}
   else{s.tx=300+(Math.random()-.5)*(id=='kades'?140:300);s.ty=500+(Math.random()-.5)*(id=='kades'?60:300)}
   s.wait=1.5+Math.random()*4}}}}
// ---------- data bersama ----------
function news(c,d){LOG.unshift(c=='warga'?'👋 '+d.nama+' resmi menjadi warga ('+d.pekerjaan+')':(d.gr?'🤝 Warga bergotong royong membangun '+d.nama:'🔨 Pembangunan '+d.nama+' dimulai'));LOG.length=Math.min(LOG.length,6);$('log').innerHTML=LOG.map(x=>'<li>'+esc(x)+'</li>').join('')}
function ui(){const n=Object.keys(D.warga).length,me=D.warga[uid];
 $('pop').textContent='Warga: '+(n+1);
 $('wl').innerHTML=[['kades',KADES]].concat(Object.entries(D.warga)).map(([id,w])=>'<div data-id="'+esc(id)+'">'+esc(w.nama)+' · '+esc(w.pekerjaan)+'</div>').join('');
 $('join').style.display=uid&&!me?'':'none';
 const t=me?'Anda: '+me.nama:n?'':'Hutan masih kosong, hanya ada Pak Kades. Jadilah warga pertama!';
 $('note').textContent=t;$('note').style.display=t?'':'none'}
function ready(){got=1;$('st').textContent=live?'🟢 Real time':'🟡 Menghubungkan ulang…';ui()}
let DBW={};const t0=Date.now();
function derive(W){
 const R=Object.entries(W).sort((a,b)=>a[1].tgl-b[1].tgl||(a[0]<b[0]?-1:1)),O={},tk=new Set();
 R.forEach(([id,w])=>{let s=w.slot==null?0:w.slot;while(tk.has(s))s++;tk.add(s);const p=SLOTS[s]||[40+(s-SLOTS.length)%7*86,895];
  O['rumah-'+id]={tipe:'rumah',nama:w.rumah,x:p[0],y:p[1],start:w.tgl,dur:14000,owner:id}});
 let prev=0;
 for(const m of MS){if(R.length<m.min)break;const st=Math.max(R[m.min-1][1].tgl,prev);O[m.id]={tipe:m.tipe,nama:m.nama,x:m.x,y:m.y,start:st,dur:m.dur,gr:m.gr||0};prev=st+m.dur}
 return O}
function merge(w){const old=D.warga,ob=D.bangunan;D.warga=w;D.bangunan=derive(w);
 if(got&&Date.now()-t0>3000){for(const id in w)if(!old[id])news('warga',w[id]);for(const id in D.bangunan)if(!ob[id]&&D.bangunan[id].tipe!='rumah')news('bangunan',D.bangunan[id])}
 live=true;ready()}
async function init(){
 try{uid=localStorage.uid||(localStorage.uid='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36))}catch(e){uid='u'+Date.now()}
 canWrite=true;
 const es=new EventSource('events');
 es.onmessage=e=>{try{merge(JSON.parse(e.data))}catch(x){}};
 es.onerror=()=>{live=false;ready()}}
async function join(){
 const v=i=>$(i).value.trim(),nama=v('fn'),usia=+v('fu'),hobi=v('fh'),job=v('fp'),g=$('fg').value;
 if(!nama||!(usia>=1&&usia<=110)||!hobi||!job){$('err').textContent='Isi nama, usia (1–110), hobi, dan pekerjaan dulu ya.';return}
 $('ok').disabled=true;
 try{
  const r=await fetch('join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:uid,nama,usia,hobi,pekerjaan:job,gender:g,rumah:v('fr')})});
  const j=await r.json();if(!r.ok)throw new Error(j.error||'gagal');
  $('modal').classList.remove('on');
 }catch(e){$('err').textContent='Gagal bergabung: '+e.message}
 $('ok').disabled=false}
// ---------- antarmuka ----------
function showW(id){const w=id=='kades'?KADES:D.warga[id];if(!w)return;
 const tt=id=='kades'?'Balai Desa':(D.bangunan['rumah-'+id]||{}).nama||w.rumah||'-';
 $('info').style.display='block';$('info').innerHTML='<div class="ktp"><h3>KARTU TANDA PENDUDUK · DESA HARAPAN JAYA</h3><dl><dt>Nama</dt><dd>'+esc(w.nama)+'</dd><dt>Usia</dt><dd>'+esc(w.usia)+' tahun</dd><dt>Jenis kelamin</dt><dd>'+(w.gender=='L'?'Laki-laki':'Perempuan')+'</dd><dt>Hobi</dt><dd>'+esc(w.hobi)+'</dd><dt>Pekerjaan</dt><dd>'+esc(w.pekerjaan)+'</dd><dt>Tempat tinggal</dt><dd>'+esc(tt)+'</dd></dl></div>'}
function showB(b){const p=prog(b),o=D.warga[b.owner];
 $('info').style.display='block';$('info').innerHTML='<b>'+esc(b.nama)+'</b> · '+LBL[b.tipe]+'<br><span style="color:var(--mut)">'+(p<1?'Sedang dibangun '+(p*100|0)+'%':'Sudah selesai')+(o?' · Pemilik: '+esc(o.nama):'')+'</span>'}
cv.onclick=e=>{$('info').style.display='none';$('drawer').classList.remove('on');$('hud').classList.remove('open');const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 let best=null,bd=22;for(const id in sim){const s=sim[id],d=Math.hypot(s.x-x,s.y-22-y);if(d<bd){bd=d;best=id}}
 if(best)return showW(best);
 for(const b of Object.values(D.bangunan).filter(b=>b.start<=Date.now())){const[w,h]=DIM[b.tipe]||DIM.rumah;if(Math.abs(x-b.x)<w/2&&y<b.y+4&&y>b.y-h)return showB(b)}};
function pv(){const m=cx,c=$('pv').getContext('2d');cx=c;c.setTransform(1.8,0,0,1.8,0,0);c.clearRect(0,0,80,100);
 person(look({gender:$('fg').value,pekerjaan:$('fp').value},$('fn').value||'x'),22,52,0,0,0);cx=m}
['fn','fg','fp'].forEach(i=>$(i).oninput=pv);
$('join').onclick=()=>{$('err').textContent='';$('drawer').classList.remove('on');$('hud').classList.remove('open');$('modal').classList.add('on');pv()};
$('mb').onclick=()=>{$('drawer').classList.toggle('on');$('hud').classList.toggle('open')};
$('wl').onclick=e=>{const id=e.target.dataset.id;if(id){$('drawer').classList.remove('on');$('hud').classList.remove('open');showW(id)}};
$('info').onclick=()=>$('info').style.display='none';
$('no').onclick=()=>$('modal').classList.remove('on');$('ok').onclick=join;
function fit(){const w=cv.clientWidth,d=devicePixelRatio||1;cv.style.height=w*H/W+'px';cv.width=w*d;cv.height=w*H/W*d;S=w*d/W}
addEventListener('resize',fit);fit();
let last=performance.now();
(function loop(n){const dt=Math.min(.1,(n-last)/1000);last=n;tick(dt);draw(n/1000);requestAnimationFrame(loop)})(last);
init();
</script></body></html>
